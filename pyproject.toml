[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aio-lib-sandbox"
dynamic = ["version"]
description = "Python SDK for Adobe Runtime Sandboxes"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
]

[tool.hatch.version]
path = "src/aio_lib_sandbox/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aio_lib_sandbox"]

[project.optional-dependencies]
dev = [
    "hatch>=1.14",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
lint = [
    "ruff check src tests",
    "ruff format --check src tests",
]
lint-fix = [
    "ruff check src tests --fix",
    "ruff format src tests",
]
unit-tests = "pytest"
test = [
    "pytest",
    "ruff check src tests",
    "ruff format --check src tests",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=src/aio_lib_sandbox --cov-report=xml --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # import sorting
    "B",      # flake8-bugbear
    "ASYNC",  # async-specific checks
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["src/aio_lib_sandbox"]

[tool.coverage.report]
show_missing = true
